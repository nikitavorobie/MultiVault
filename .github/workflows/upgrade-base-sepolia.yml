name: Upgrade Base Sepolia

on:
  workflow_dispatch:

jobs:
  upgrade:
    name: Upgrade Contract
    runs-on: ubuntu-latest
    environment: base-sepolia

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        run: forge build

      - name: Read deployment addresses
        id: addresses
        run: |
          MULTIVAULT_PROXY=$(jq -r '.contracts.MultiVault.proxy' deployments/base-sepolia.json)
          EXECUTOR_PROXY=$(jq -r '.contracts.PayoutExecutor.proxy' deployments/base-sepolia.json)
          echo "multivault_proxy=$MULTIVAULT_PROXY" >> $GITHUB_OUTPUT
          echo "executor_proxy=$EXECUTOR_PROXY" >> $GITHUB_OUTPUT
          echo "📍 MultiVault Proxy: $MULTIVAULT_PROXY"
          echo "📍 PayoutExecutor Proxy: $EXECUTOR_PROXY"

      - name: Check current contract state
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          PROXY_ADDRESS: ${{ steps.addresses.outputs.multivault_proxy }}
        run: |
          forge script script/CheckCurrentState.s.sol:CheckCurrentStateScript \
            --rpc-url $BASE_SEPOLIA_RPC_URL \
            -vv

      - name: Upgrade contract
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          PROXY_ADDRESS: ${{ steps.addresses.outputs.multivault_proxy }}
        run: |
          forge script script/Upgrade.s.sol:UpgradeScript \
            --rpc-url $BASE_SEPOLIA_RPC_URL \
            --broadcast \
            --verify \
            -vvvv

      - name: Save upgrade artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-artifacts
          path: broadcast/
