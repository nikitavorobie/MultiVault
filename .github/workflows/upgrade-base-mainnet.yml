name: Upgrade Base Mainnet

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "UPGRADE" to confirm mainnet upgrade'
        required: true

jobs:
  upgrade:
    name: Upgrade Contract on Mainnet
    runs-on: ubuntu-latest
    environment: base-mainnet

    steps:
      - name: Validate confirmation
        if: github.event.inputs.confirm != 'UPGRADE'
        run: |
          echo "Upgrade cancelled. Confirmation required."
          exit 1

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        run: forge build

      - name: Read deployment addresses
        id: addresses
        run: |
          MULTIVAULT_PROXY=$(jq -r '.contracts.MultiVault.proxy' deployments/base-mainnet.json)
          EXECUTOR_PROXY=$(jq -r '.contracts.PayoutExecutor.proxy' deployments/base-mainnet.json)
          echo "multivault_proxy=$MULTIVAULT_PROXY" >> $GITHUB_OUTPUT
          echo "executor_proxy=$EXECUTOR_PROXY" >> $GITHUB_OUTPUT
          echo "📍 MultiVault Proxy: $MULTIVAULT_PROXY"
          echo "📍 PayoutExecutor Proxy: $EXECUTOR_PROXY"

      - name: Upgrade contract
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASE_MAINNET_RPC_URL: ${{ secrets.BASE_MAINNET_RPC_URL }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          PROXY_ADDRESS: ${{ steps.addresses.outputs.multivault_proxy }}
        run: |
          forge script script/Upgrade.s.sol:UpgradeScript \
            --rpc-url $BASE_MAINNET_RPC_URL \
            --broadcast \
            --verify \
            -vvvv

      - name: Save upgrade artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mainnet-upgrade
          path: broadcast/

      - name: Create upgrade record
        run: |
          echo "Upgrade completed at $(date)" >> upgrade-log.txt
          echo "Network: Base Mainnet" >> upgrade-log.txt
          echo "Proxy: ${{ steps.addresses.outputs.multivault_proxy }}" >> upgrade-log.txt

      - name: Commit upgrade log
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: record mainnet upgrade"
          file_pattern: upgrade-log.txt
