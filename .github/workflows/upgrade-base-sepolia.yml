name: Upgrade Base Sepolia

on:
  workflow_dispatch:
    inputs:
      proxy_address:
        description: 'Proxy address to upgrade'
        required: true
        default: '0xB4FD2402c97c0F2E38B3Be91596aDe8927A36439'

jobs:
  upgrade:
    name: Upgrade Contract
    runs-on: ubuntu-latest
    environment: base-sepolia

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Build contracts
        run: forge build

      - name: Upgrade contract
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          BASE_SEPOLIA_RPC_URL: ${{ secrets.BASE_SEPOLIA_RPC_URL }}
          BASESCAN_API_KEY: ${{ secrets.BASESCAN_API_KEY }}
          PROXY_ADDRESS: ${{ github.event.inputs.proxy_address }}
        run: |
          forge script script/Upgrade.s.sol:UpgradeScript \
            --rpc-url $BASE_SEPOLIA_RPC_URL \
            --broadcast \
            --verify \
            -vvvv

      - name: Save upgrade artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-artifacts
          path: broadcast/
